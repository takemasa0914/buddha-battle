<style>
  :root{
    --washi: #f6efdf;
    --ink: #3b2a1a;
    --ink-soft: #5a4632;
    --vermillion: #b8402c;
    --vermillion-dark: #963120;
    --gold: #b8862f;
    --line: #d8c9a3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--washi);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 60px;
    text-align: center;
  }
  h1 {
    font-size: 2.2rem;
    color: var(--vermillion-dark);
    margin: 0 0 6px;
    letter-spacing: 0.05em;
  }
  p.sub {
    font-size: 1.3rem;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }
  .qr-wrap {
    display: inline-block;
    background: #fffdf6;
    border: 3px solid var(--gold);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 4px 16px rgba(90,70,50,0.12);
  }
  .qr-wrap img {
    width: min(70vw, 460px);
    height: auto;
    display: block;
  }
  .url-text {
    margin-top: 18px;
    font-size: 1.1rem;
    color: var(--ink-soft);
    word-break: break-all;
  }
  .steps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 44px;
  }
  .step {
    background: rgba(255,253,246,0.8);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px;
    width: 220px;
  }
  .step .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--vermillion);
    color: #fff;
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .step p {
    font-size: 1.15rem;
    margin: 0;
    line-height: 1.6;
  }
  @media print {
    body { background: #fff; }
  }
</style>
</head>
